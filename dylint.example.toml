# Copy this file to the root of the workspace you want to lint as dylint.toml.
# Each supplied array replaces that default array in its entirety.
[async_hygiene]
# Every budget accepts a positive integer or "unlimited" (no budget check).
# Unlimited analysis may not terminate or fit in memory; CI can impose a timeout.
max-instances = 10000
max-iterations = 100
# Omit this to inherit max-iterations, including its "unlimited" setting.
# max-dataflow-iterations = 100
# Root depth is zero; each aggregate field consumes one level, including writes.
max-aggregate-depth = 8
# Matching ancestors of the same function; existing summaries and shrinking
# types retain their exceptions. This is not a crate-wide per-function count.
max-recursive-instances = 8
# At least one note per exhausted budget is always printed, even at a small cap.
# Repeated budget failures share the remaining allowance with other details.
max-incomplete-notes = 5
# Emit per-crate counts, high-water marks, convergence, elapsed time, and all
# exhausted budgets (including those hit during provisional analysis work).
statistics = false

prohibited = [
    { path = "tokio::runtime::Handle::block_on", reason = "nested runtimes panic" },
    { path = "tokio::runtime::Runtime::block_on", reason = "nested runtimes panic" },
    { path = "futures_executor::block_on", reason = "blocks the executor thread" },
    { path = "std::thread::sleep", reason = "use an async timer" },
    { path = "std::thread::park", reason = "blocks the executor thread" },
    # { path = "my_crate::blocking_io", reason = "use the blocking pool" },
]

insulators = [
    { path = "tokio::task::spawn_blocking", callback-args = [0] },
    { path = "tokio::task::block_in_place", callback-args = [0] },
    # Method receivers count as argument zero.
    { path = "tokio::runtime::Handle::spawn_blocking", callback-args = [1] },
    { path = "tokio::runtime::Runtime::spawn_blocking", callback-args = [1] },
    { path = "std::thread::spawn", callback-args = [0] },
]
